name: Spike OKOK · APK debug

on:
  push:
    branches: ["spike/okok-capture"]
    paths:
      - "spike-okok/**"
      - ".github/workflows/spike-okok-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-okok-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike-okok
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios (decodificador OKOK, TV-01..TV-04)
        run: ./gradlew :okok-decoder:test :app:testDebugUnitTest --console=plain

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-okok-test-reports
          path: |
            spike-okok/okok-decoder/build/reports/tests/
            spike-okok/okok-decoder/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: spike-okok-debug-apk
          path: spike-okok/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
